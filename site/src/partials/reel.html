{{#if video}}
<div class="film" data-film>
  <video muted loop playsinline preload="none" poster="{{videoPoster}}" data-src="{{video}}" aria-label="The first series: a gamer playing Counter-Strike in the middle of the ocean"></video>
  <div class="film__controls">
    <button class="film__btn" type="button" data-film-play><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg><span data-film-play-label>Pause</span></button>
    <button class="film__btn" type="button" data-film-sound><svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg><span data-film-sound-label>Sound on</span></button>
  </div>
</div>
{{else}}{{#if instagram}}
<a class="card" href="{{instagram}}" rel="noopener" target="_blank">
  <span class="card__in" aria-hidden="true">
    <span class="card__date">February 2026</span>
    <span class="card__horizon"></span>
    <span class="card__point"></span>
    <span class="card__foot">
      <span class="card__title"><span class="nowrap">Counter-Strike,</span> middle of the ocean</span>
      <span class="card__cta">Watch on Instagram <svg class="icon"><use href="#i-ext"/></svg></span>
    </span>
  </span>
  <span class="sr-only">Watch the first series on Instagram (opens in a new tab)</span>
</a>
{{else}}
<div class="card">
  <span class="card__in" aria-hidden="true">
    <span class="card__date">February 2026</span>
    <span class="card__horizon"></span>
    <span class="card__point"></span>
    <span class="card__foot"><span class="card__title"><span class="nowrap">Counter-Strike,</span> middle of the ocean</span></span>
  </span>
</div>
{{/if}}{{/if}}
