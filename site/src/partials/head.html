<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{#if noindex}}<meta name="robots" content="noindex">
{{else}}<link rel="canonical" href="{{origin}}{{path}}">
<meta property="og:url" content="{{origin}}{{path}}">
{{/if}}<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="wubba">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{origin}}/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="98.8M views across the series and its reposts, under the wubba wordmark">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wubbastudio">
<link rel="icon" href="/assets/img/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script>document.documentElement.classList.add("js"{{#if primary}}, "primary-in-view"{{/if}})</script>
<script type="module" src="/assets/js/site.js"></script>

</head>
